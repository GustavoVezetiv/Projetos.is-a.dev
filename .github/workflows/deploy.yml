name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Incluir Músicas e Flores no artefato
        run: cp -R MusicasEFlores/. dist/MusicasEFlores/

      - name: Validar Músicas e Flores no artefato
        run: |
          test -f dist/MusicasEFlores/index.html
          test -f dist/MusicasEFlores/src/js/app.js
          test -f dist/MusicasEFlores/src/css/base.css

      - name: Smoke test de Músicas e Flores
        run: |
          python3 -m http.server 4173 --directory dist &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          page=$(curl --fail --retry 5 --retry-connrefused --silent http://127.0.0.1:4173/MusicasEFlores/)
          printf '%s' "$page" | grep -Fq 'Músicas &amp; Flores'
          printf '%s' "$page" | grep -Fq 'src/js/app.js'

      - name: Copiar CNAME para dist
        run: cp CNAME dist/CNAME

      - name: Criar 404 para React Router
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar pasta dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
